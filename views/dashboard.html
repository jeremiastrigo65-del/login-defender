<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-400">🛡️ SecureAccess</h1>
    <button onclick="logout()" class="text-sm text-gray-400 hover:text-white transition">Sign Out</button>
  </nav>
  
  <div class="max-w-4xl mx-auto mt-12 p-6">
    <div class="bg-gray-800 border border-gray-700 rounded-xl p-8 shadow-lg">
      <h2 class="text-2xl font-bold mb-2">Welcome back, <span id="who" class="text-blue-400"></span></h2>
      <p class="text-gray-400">Your session is active and secured.</p>
      
      <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700">
          <h3 class="text-sm text-gray-500 uppercase tracking-wider mb-1">Status</h3>
          <p class="text-green-400 font-semibold">Authenticated</p>
        </div>
        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700">
          <h3 class="text-sm text-gray-500 uppercase tracking-wider mb-1">Clearance</h3>
          <p class="text-blue-400 font-semibold">Standard User</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    fetch('/api/me').then(r => r.json()).then(u => {
      if (!u) return location.href = '/login';
      document.getElementById('who').textContent = u.username;
    });
    function logout() {
      fetch('/api/logout', { method: 'POST', redirect: 'manual' })
        .then(() => location.href = '/login');
    }
  </script>
</body>
</html>
