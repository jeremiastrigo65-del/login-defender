<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 🌍 Load Leaflet Map Library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 350px; width: 100%; border-radius: 0.5rem; z-index: 0; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <h1 class="text-xl font-bold text-red-500">⚠️ System Logs</h1>
      <span class="bg-red-900/50 text-red-400 text-xs px-2 py-1 rounded border border-red-800 font-mono">ADMIN ONLY</span>
    </div>
    <div class="flex items-center space-x-4">
      <span class="text-sm text-gray-400">Logged in as: <strong id="who" class="text-white"></strong></span>
      <button onclick="logout()" class="text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded transition">Sign Out</button>
    </div>
  </nav>
  
  <div class="max-w-7xl mx-auto mt-8 p-6 space-y-6">
    
    <!-- 🗺️ THE MAP CARD -->
    <div class="bg-gray-800 border border-gray-700 rounded-xl shadow-lg p-6">
      <h2 class="text-lg font-semibold text-gray-200 mb-4">🌍 Global Login Locations</h2>
      <div id="map" class="border border-gray-600"></div>
    </div>

    <!-- 📊 THE TABLE CARD -->
    <div class="bg-gray-800 border border-gray-700 rounded-xl shadow-lg overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
        <h2 class="text-lg font-semibold text-gray-200">Recent Authentication Attempts</h2>
        <button onclick="load()" class="text-sm bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded transition">🔄 Refresh</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-400">
          <thead class="bg-gray-900 text-gray-500 uppercase text-xs font-mono tracking-wider">
            <tr>
              <th class="px-6 py-3">Timestamp</th>
              <th class="px-6 py-3">Username</th>
              <th class="px-6 py-3">IP Address</th>
              <th class="px-6 py-3">ISP / Network</th>
              <th class="px-6 py-3">Location</th>
              <th class="px-6 py-3">Status</th>
              <th class="px-6 py-3">Reason</th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y divide-gray-700">
            <tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">Loading logs...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let map;
    let markersLayer;

    // Initialize Auth
    fetch('/api/me').then(r => r.json()).then(u => {
      if (!u || u.role !== 'admin') return location.href = '/login';
      document.getElementById('who').textContent = u.username;
      
      // Initialize Map
      map = L.map('map').setView([20, 0], 2); // Center of world
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(map);
      
      markersLayer = L.layerGroup().addTo(map);
      
      load();
    });

    async function load() {
      const tbody = document.getElementById('rows');
      tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">Fetching data...</td></tr>';
      
      const r = await fetch('/api/admin/attempts');
      const data = await r.json();
      
      // Clear old map markers
      markersLayer.clearLayers();

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">No login attempts recorded yet.</td></tr>';
        return;
      }

      // Process table rows
      tbody.innerHTML = data.map(a => {
        const date = new Date(a.attempted_at).toLocaleString();
        const isSuccess = a.success;
        const rowClass = isSuccess ? 'hover:bg-gray-700/50' : 'bg-red-900/10 hover:bg-red-900/20';
        const statusBadge = isSuccess 
          ? '<span class="bg-green-900/50 text-green-400 px-2 py-1 rounded text-xs border border-green-800">SUCCESS</span>'
          : '<span class="bg-red-900/50 text-red-400 px-2 py-1 rounded text-xs border border-red-800">FAILED</span>';
          
        return `
          <tr class="${rowClass} transition duration-150">
            <td class="px-6 py-4 font-mono text-xs">${date}</td>
            <td class="px-6 py-4 font-semibold text-gray-200">${a.username || '<i>Unknown</i>'}</td>
            <td class="px-6 py-4 font-mono">${a.ip_address}</td>
            <td class="px-6 py-4 text-blue-300">${a.isp}</td>
            <td class="px-6 py-4">${a.country !== 'Local' ? `${a.city}, ${a.country}` : 'Localhost'}</td>
            <td class="px-6 py-4">${statusBadge}</td>
            <td class="px-6 py-4 text-xs text-gray-400">${a.reason || '-'}</td>
          </tr>
        `;
      }).join('');

      // 🌍 Plot markers on map (Ignore Localhost)
      data.forEach(a => {
        if (a.city !== 'Local' && a.country !== 'Local' && a.city !== 'Unknown') {
          // We use a quick free geocoding fetch to get lat/lon from the city name
          fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(a.city + ', ' + a.country)}`)
            .then(res => res.json())
            .then(geo => {
              if (geo && geo.length > 0) {
                const lat = geo[0].lat;
                const lon = geo[0].lon;
                const color = a.success ? 'green' : 'red';
                
                // Create custom colored dot
                const customIcon = L.divIcon({
                  className: 'custom-icon',
                  html: `<div style="background-color: ${color}; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>`,
                  iconSize: [12, 12]
                });

                L.marker([lat, lon], { icon: customIcon })
                  .bindPopup(`<b>${a.username}</b><br>${a.city}, ${a.country}<br>${a.isp}<br>${a.success ? '✅ Success' : '❌ Failed'}`)
                  .addTo(markersLayer);
              }
            });
        }
      });
    }

    function logout() {
      fetch('/api/logout', { method: 'POST', redirect: 'manual' })
        .then(() => location.href = '/login');
    }
  </script>
</body>
</html>
